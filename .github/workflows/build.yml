name: Build Fabric mod

on:
  push:
    branches:
      - main
      - arena/fadd62fc-skidd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify archive preparation
        run: python3 -m unittest discover -s tests -v
      - name: Compile and remap Fabric mod
        shell: bash
        run: |
          if ./gradlew build --no-daemon --console=plain > build-output.log 2>&1; then
            tail -n 50 build-output.log
          else
            tail -n 100 build-output.log
            python3 tools/ci_error.py build-output.log
            exit 1
          fi
      - name: Verify complete 1.21.11 installable JAR
        run: python3 tools/verify_installable.py build/libs/zelith-combat-integrated-1.0.0.jar
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: zelith-combat-integrated
          path: build/libs/zelith-combat-integrated-1.0.0.jar
          if-no-files-found: error
